name: Avocado-E2E health checks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: '55 21 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Build with Maven
        run: mvn clean install -DskipTests

  test:
    runs-on: macos-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' # Run on manual trigger or schedule
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Run Maven test and create extentReports directory
        run: |
          mvn clean verify -Dremote=true -Dbrowser=chrome 
          mkdir -p reports/extentReports

      - name: Verify report exists before copy
        run: ls -l target/surefire-reports/emailable-report.html

      - name: Copy report to SurefireReports
        run: mvn resources:resources

      - name: Verify report exists after copy
        run: ls -l src/main/SurefireReports/emailable-report.html

      - name: Upload report as artifact
        uses: actions/upload-artifact@v3
        with:
          name: Report
          path: src/main/SurefireReports/emailable-report.html
          retain-artifacts: false

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v3
        with:
          name: failure-screenshots
          path: reports/screenshotsFailure

      - name: CINotify Email
        uses: cinotify/github-action@v1.4.0
        with:
          to: karim.salem@twerlo.com
          subject: "E2E Test Automation Report - Run ${{ github.run_number }}"
          body: |
            Avodad0 E2E test automation run has completed. Check the attached report for details.
            attachment: src/main/SurefireReports/emailable-report.html
