name: Avocado-E2E health checks

on:
  workflow_dispatch:
  schedule:
    - cron: '55 21 * * *'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Build with Maven
        run: mvn clean install -DskipTests

  test:
    runs-on: windows-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Run Maven test and create extentReports directory
        run: |
          mvn clean verify -Dremote=true -Dbrowser=chrome
          mkdir -p reports/extentReports

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Report
          path: target/surefire-reports/emailable-report.html
          retain-artifacts: false

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: reports/screenshotsFailure
